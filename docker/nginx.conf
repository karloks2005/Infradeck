server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trust X-Forwarded-For only from proxies on private/Docker networks (e.g. the
    # optional Caddy container), so rate limits see the real client address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Dashboard and API share one origin: no CORS, and collectors and browsers
    # use the same address (http(s)://<host>/api).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
