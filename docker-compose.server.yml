# Server stack, published over HTTPS by an existing Traefik.
#   docker compose -f docker-compose.server.yml up -d --build
# Nothing here needs editing: your domain and Traefik names come from .env (see example.env),
# so `git pull` can always update this file. Don't copy it under another name: Compose
# prefers compose.yml (the development stack) when two default-named files exist.
# Tip: put COMPOSE_FILE=docker-compose.server.yml in .env so a plain `docker compose ...` uses it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homelab-redis
    restart: unless-stopped
    networks: [data]
    # Needs a password: Redis holds the login sessions, so nothing that can merely reach it on the network
    # may use it. Generate one with `openssl rand -hex 24` (letters and digits only, so it fits in a URL).
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (generate one with openssl rand -hex 24)}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: homelab-backend
    image: homelab-backend:latest
    restart: unless-stopped
    networks: [data, front]
    environment:
      DATABASE_URL: postgresql+psycopg://homelab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/homelab
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (generate one with openssl rand -hex 24)}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-models/gemini-3.5-flash}
      # Served over HTTPS via Traefik, so the login cookie is HTTPS-only.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Only the first account can register; set to true to let others sign up.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-homie_session}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-3}
      REGISTER_RATE_WINDOW_SECONDS: ${REGISTER_RATE_WINDOW_SECONDS:-3600}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      # Limits on what collectors can do. A check-in must come at least this share of the check interval after the
      # previous one (0 switches it off); the install holds at most MAX_SERVERS; /docs is off unless enabled.
      INGEST_MIN_SPACING_RATIO: ${INGEST_MIN_SPACING_RATIO:-0.25}
      MAX_SERVERS: ${MAX_SERVERS:-200}
      ENROLL_RATE_LIMIT: ${ENROLL_RATE_LIMIT:-30}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Setup token for the very first account. Empty: one is generated and printed in the backend log.
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      # How long a token from "Connect a server" stays valid, in seconds.
      JOIN_TOKEN_TTL_SECONDS: ${JOIN_TOKEN_TTL_SECONDS:-900}
      # Key that encrypts stored secrets such as two-factor secrets (generate: docker compose run --rm backend python -m src.backend.secrets_box).
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Collector endpoints answer only through the collector-gate container (VPN or internal).
      COLLECTOR_ACCESS: strict
      # Shown in the Connect a server panel: your VPN address for the gate, and pinned images.
      COLLECTOR_PUBLIC_URL: ${COLLECTOR_PUBLIC_URL:-}
      COLLECTOR_IMAGE: ${COLLECTOR_IMAGE:-}
      DOCKER_PROXY_IMAGE: ${DOCKER_PROXY_IMAGE:-}
    # No host port: nginx (frontend) reaches the backend over the Compose network,
    # and browsers/collectors use https://<domain>/api. Avoids clashing with other
    # services on the server. Debug with: docker compose exec backend ...
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitors the machine running this stack. Other servers use collector-compose.yml.
  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    image: homelab-collector:latest
    container_name: homelab-collector
    restart: unless-stopped
    networks: [collector]
    environment:
      # Through the gate's internal listener (not published); the public listener refuses collectors.
      HOMELAB_API_URL: http://collector-gate:8080/api
      # Marks this collector as the machine running the dashboard (the charts at the top).
      HOMELAB_DASHBOARD_HOST: "true"
      # Nothing to configure: this machine shows up under "New servers detected"
      # on the dashboard. An optional enrollment key skips that approval.
      HOMELAB_ENROLL_KEY: ${HOMELAB_ENROLL_KEY:-}
      HOMELAB_SERVER_NAME: ${HOMELAB_SERVER_NAME:-}
      # Optional internet check, off when empty: comma-separated host:port targets this collector tries to reach.
      HOMELAB_CONNECTIVITY_TARGETS: ${HOMELAB_CONNECTIVITY_TARGETS:-}
      # Docker data comes through the read-only proxy; the collector has no Docker socket.
      HOMELAB_DOCKER_HOST: /run/docker-proxy/docker.sock
      HOMELAB_CHECK_INTERVAL_SECONDS: ${HOMELAB_CHECK_INTERVAL_SECONDS:-60}
      HOMELAB_MACHINE_ID: ${HOMELAB_MACHINE_ID:-}
    volumes:
      - /proc:/host/proc:ro
      - /:/hostfs:ro
      - collector_state:/var/lib/homelab-collector
      # Summary from the optional system helper (read-only; empty unless that profile runs).
      - system_events:/helper:ro
      - docker_proxy_socket:/run/docker-proxy:ro
    # Read-only host view, no capabilities: as root it then can't read other users' private
    # files (SSH keys, .env) even though / is mounted.
    cap_drop: [ALL]
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      collector-gate:
        condition: service_started

  # The only way to reach the collector endpoints. Not on the reverse proxy's network, so other
  # apps can't register collectors. Publish its VPN listener on your VPN address only: Docker's
  # published ports bypass ufw and similar firewalls, so never bind it to 0.0.0.0 and rely on those.
  collector-gate:
    image: nginx:alpine
    container_name: homelab-collector-gate
    restart: unless-stopped
    networks: [front, collector]
    ports:
      - "${COLLECTOR_BIND:-127.0.0.1}:${COLLECTOR_PORT:-8081}:8081"
    volumes:
      - ./docker/nginx.collector.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

  # The only container that mounts the Docker socket (a mount flag can't make it read-only).
  # It answers four read requests and nothing else. It has no network at all: the collector
  # reaches it through a Unix socket in a volume only the two of them share. See SECURITY.md.
  docker-proxy:
    build:
      context: .
      dockerfile: docker/docker-proxy.Dockerfile
    image: homelab-docker-proxy:latest
    container_name: homelab-docker-proxy
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker_proxy_socket:/run/docker-proxy

  # Optional: adds OOM-killer process names, kernel errors and crash-vs-clean-shutdown detection.
  # Enable with: docker compose --profile system-events up -d
  # Its only privilege is CAP_SYSLOG (to read the kernel log); it has no network, a read-only
  # filesystem, and sees the host only through the read-only wtmp file. See SECURITY.md.
  system-helper:
    profiles: ["system-events"]
    build:
      context: .
      dockerfile: docker/system-helper.Dockerfile
    image: homelab-system-helper:latest
    container_name: homelab-system-helper
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SYSLOG]
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/log/wtmp:/host/wtmp:ro
      - system_events:/out

  # Optional and off by default: names the process behind each listening port for the Network tab.
  # Enable with: docker compose --profile port-owners up -d
  # This is the most privileged piece of the stack. Seeing which process holds a socket means looking into
  # other users' processes, which needs the host's /proc, CAP_SYS_PTRACE, CAP_DAC_READ_SEARCH and no
  # AppArmor confinement. Together those can read any file on the host, so it gets no network, a
  # read-only filesystem, and publishes only protocol, port and process name. Read SECURITY.md first.
  port-owners:
    profiles: ["port-owners"]
    build:
      context: .
      dockerfile: docker/system-helper.Dockerfile
    image: homelab-system-helper:latest
    container_name: homelab-port-owners
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    environment:
      HOMELAB_HELPER_MODE: port-owners
    volumes:
      - /proc:/host/proc:ro
      - system_events:/out

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_LIVE_GRAPH_REFRESH_INTERVAL_SECONDS: ${LIVE_GRAPH_REFRESH_INTERVAL_SECONDS:-3}
    container_name: homelab-frontend
    restart: unless-stopped
    # Serves the dashboard and proxies /api to the backend; Traefik publishes it
    # over HTTPS on your domain. The plain-HTTP port is bound to localhost only
    # (set FRONTEND_BIND=0.0.0.0 to also allow direct LAN/VPN access).
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    volumes:
      # Public listener only: collector endpoints are refused here (see the collector-gate service).
      - ./docker/nginx.strict.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - front
      - traefik
    labels:
      - traefik.enable=true
      # All values come from .env: DASHBOARD_DOMAIN (required), TRAEFIK_ROUTER, TRAEFIK_ENTRYPOINT,
      # TRAEFIK_CERT_RESOLVER and TRAEFIK_NETWORK (defaults shown).
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}
      - traefik.http.routers.${TRAEFIK_ROUTER:-homelab}.rule=Host(`${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}`)
      - traefik.http.routers.${TRAEFIK_ROUTER:-homelab}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${TRAEFIK_ROUTER:-homelab}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${TRAEFIK_ROUTER:-homelab}.loadbalancer.server.port=80
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Three networks keep each container to what it needs. Redis and PostgreSQL are on `data` only, which has no
  # route out; the collector is on `collector` only and can reach nothing but the gate.
  data:
    internal: true
  front:
  collector:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_default}  # Traefik's Docker network; same value as the label above

volumes:
  postgres_data:
  redis_data:
  collector_state:
  system_events:
  docker_proxy_socket:
