# Weekly pull requests that move the pinned versions forward (docs/development.md, "Updating dependencies").
# One grouped PR per ecosystem, so CI tests each batch before anything is merged. Jumps that need a decision
# (a new PostgreSQL or Redis major, another Python minor, a Node major) are left out; do those by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { python: { patterns: ["*"] } }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly, day: monday }
    groups: { frontend: { patterns: ["*"] } }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
    groups: { base-images: { patterns: ["*"] } }
    ignore:
      - { dependency-name: python, update-types: [version-update:semver-major, version-update:semver-minor] }
      - { dependency-name: node, update-types: [version-update:semver-major] }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { compose-images: { patterns: ["*"] } }
    ignore:
      - { dependency-name: postgres, update-types: [version-update:semver-major] }
      - { dependency-name: redis, update-types: [version-update:semver-major] }
      - { dependency-name: caddy, update-types: [version-update:semver-major] }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
    commit-message: { prefix: chore, include: scope }
