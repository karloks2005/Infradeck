# Builds every Infradeck image (backend, frontend, collector, Docker proxy, system helper) and publishes them to
# GHCR, signed with cosign (keyless, using this workflow's identity). Runs when a version tag is pushed; the tag must match
# the VERSION file:
#   git tag v0.1.0 && git push origin v0.1.0
# The server stack runs these images (docker-compose.server.yml names the version), and remote hosts install the
# collector ones pinned by digest, so no code is ever fetched from the dashboard. Third-party actions are pinned to commit hashes; update them deliberately.
name: Publish images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, dockerfile: docker/backend.Dockerfile }
          - { name: frontend, dockerfile: docker/frontend.Dockerfile }
          - { name: collector, dockerfile: docker/collector.Dockerfile }
          - { name: docker-proxy, dockerfile: docker/docker-proxy.Dockerfile }
          - { name: system-helper, dockerfile: docker/system-helper.Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The images report the version in VERSION, so a tag that says otherwise would publish mislabelled images.
      - name: The tag matches VERSION
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION ($(cat VERSION)). Update VERSION first, then tag."
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      # The collector and Docker proxy digests go into .env for Connect a server; the others are only listed.
      - name: Digest
        run: |
          VAR=$(echo "${{ matrix.name }}" | tr 'a-z-' 'A-Z_')
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.name }}" in
            collector|docker-proxy) echo "\`${VAR}_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
