# Database migrations (Alembic). The backend runs them itself at start (src/backend/migrate.py); this file is for
# writing new ones: `alembic revision --autogenerate -m "what changed"` against a database at the latest revision.
# The database comes from DATABASE_URL, as for the backend. See docs/development.md.
[alembic]
script_location = %(here)s/src/backend/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
